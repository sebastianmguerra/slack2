<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slack — 1-on-1 Direct Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/slack.css" />
</head>
<body>

  <!-- ========================================================================
       1. MAIN SLACK INTERFACE (NO LOGIN REQUIRED)
       ======================================================================== -->
  <div id="slack-app" class="slack-app">
    <!-- Global Top Bar (#350d36) -->
    <header class="slack-topbar">
      <div class="topbar-left">
        <button type="button" id="mobile-menu-toggle" class="mobile-menu-btn" title="Toggle sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <button type="button" class="topbar-icon-btn" title="History">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"></circle>
            <polyline points="12 7 12 12 15 15"></polyline>
          </svg>
        </button>
      </div>

      <div class="topbar-center">
        <div class="slack-search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            id="chat-search-input"
            class="slack-search-input"
            placeholder="Search in conversation..."
          />
          <button type="button" id="chat-search-clear" class="search-clear-btn hidden" title="Clear search">✕</button>
        </div>
      </div>

      <div class="topbar-right">
        <button type="button" id="topbar-switch-user-btn" class="topbar-db-badge" title="Switch between User 1 and User 2">
          <span class="status-dot"></span>
          <span id="topbar-switch-user-text">Switch user</span>
        </button>

        <button type="button" id="topbar-user-btn" class="topbar-user-btn" title="Edit your profile">
          <img id="topbar-user-avatar" class="topbar-user-avatar" src="" alt="My profile" />
          <span class="topbar-user-presence"></span>
        </button>
      </div>
    </header>

    <div class="slack-body">
      <!-- Left Sidebar (#3F0E40) -->
      <aside id="slack-sidebar" class="slack-sidebar">
        <div class="sidebar-workspace-header" id="workspace-header-btn">
          <div class="workspace-title-group">
            <span id="workspace-name-label">Slack Chat</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
          <button type="button" id="sidebar-compose-focus-btn" class="workspace-compose-btn" title="New message">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
          </button>
        </div>

        <div class="sidebar-scroll">
          <div class="sidebar-section-header">
            <div class="sidebar-section-label">
              <span>▾</span>
              <span>Direct messages</span>
            </div>
          </div>

          <div id="dm-users-list" class="dm-list">
            <!-- Dynamically populated with the 1-on-1 participants -->
          </div>
        </div>

        <!-- Current active user card at bottom-left -->
        <div class="sidebar-current-user">
          <div id="sidebar-my-profile-trigger" class="sidebar-user-info" title="Click to edit your photo, name or @username">
            <div class="sidebar-user-avatar-wrap">
              <img id="sidebar-my-avatar" class="sidebar-user-avatar" src="" alt="My avatar" />
              <span class="sidebar-user-online"></span>
            </div>
            <div class="sidebar-user-text">
              <div id="sidebar-my-name" class="sidebar-user-name"></div>
              <div id="sidebar-my-username" class="sidebar-user-handle"></div>
            </div>
          </div>

          <div class="sidebar-user-actions">
            <button type="button" id="btn-open-edit-profile" class="sidebar-action-btn" title="Edit your profile">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
              </svg>
            </button>
            <button type="button" id="btn-switch-user" class="sidebar-action-btn" title="Switch active user (User 1 ⇄ User 2)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="17 1 21 5 17 9"></polyline>
                <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                <polyline points="7 23 3 19 7 15"></polyline>
                <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
              </svg>
            </button>
          </div>
        </div>
      </aside>

      <!-- Main Central Chat Area -->
      <main class="slack-main">
        <!-- Conversation Header -->
        <div class="chat-header">
          <button type="button" id="chat-header-partner-btn" class="chat-partner-trigger" title="View profile">
            <img id="chat-header-avatar" class="chat-header-avatar" src="" alt="Avatar" />
            <span id="chat-header-name" class="chat-header-name">Loading...</span>
            <span id="chat-header-username" class="chat-header-username">@username</span>
            <span id="chat-header-presence" class="chat-header-presence"></span>
          </button>

          <div class="chat-header-actions">
            <button type="button" id="btn-clear-chat" class="header-pill-btn" title="Clear all messages in this conversation">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
              </svg>
              <span>Clear</span>
            </button>

            <button type="button" id="btn-toggle-drawer" class="header-pill-btn" title="Toggle profile panel">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <span>Profile</span>
            </button>
          </div>
        </div>

        <!-- Messages Viewport -->
        <div id="messages-viewport" class="messages-viewport">
          <!-- DM Hero + Messages rendered dynamically -->
        </div>

        <!-- Slack Message Composer -->
        <div class="composer-wrapper">
          <div class="slack-composer">
            <div class="composer-format-bar">
              <button type="button" class="format-btn" data-format="bold" title="Bold (*text*)"><strong>B</strong></button>
              <button type="button" class="format-btn" data-format="italic" title="Italic (_text_)"><em>I</em></button>
              <button type="button" class="format-btn" data-format="strike" title="Strikethrough (~text~)"><span style="text-decoration: line-through;">S</span></button>
              <div class="format-divider"></div>
              <button type="button" class="format-btn" data-format="code" title="Inline code (`code`)">&lt;/&gt;</button>
              <button type="button" class="format-btn" data-format="quote" title="Blockquote (&gt; text)">❝</button>
            </div>

            <div id="composer-attachment-preview" class="composer-attachment-preview hidden">
              <div class="attachment-thumb-box">
                <img id="composer-attachment-img" class="attachment-thumb" src="" alt="Attachment" />
                <button type="button" id="composer-attachment-remove" class="attachment-remove-btn" title="Remove image">✕</button>
              </div>
            </div>

            <textarea
              id="composer-input"
              class="composer-textarea"
              rows="1"
              placeholder="Send a message..."
            ></textarea>

            <div class="composer-bottom-bar">
              <div class="composer-tools-left">
                <label class="composer-icon-btn" for="composer-image-input" title="Attach image">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                  </svg>
                </label>
                <input type="file" id="composer-image-input" accept="image/*" class="hidden" />

                <button type="button" id="btn-emoji-picker" class="composer-icon-btn" title="Insert emoji">
                  😊
                </button>

                <div id="emoji-popover" class="emoji-popover hidden"></div>
              </div>

              <button type="button" id="btn-send-message" class="slack-send-btn" disabled title="Send message (Enter)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
              </button>
            </div>
          </div>

          <div class="typing-status-bar">
            <span id="typing-indicator-text"></span>
            <span><strong>Enter</strong> to send · <strong>Shift + Enter</strong> for new line</span>
          </div>
        </div>
      </main>

      <!-- Right-Side Slack Profile Drawer -->
      <aside id="profile-drawer" class="slack-profile-drawer hidden">
        <div class="drawer-header">
          <span>Profile</span>
          <button type="button" id="btn-close-drawer" class="drawer-close-btn" title="Close panel">✕</button>
        </div>
        <div class="drawer-body">
          <img id="drawer-avatar" class="drawer-avatar-lg" src="" alt="Profile photo" />
          <div id="drawer-name" class="drawer-display-name">Name</div>
          <div id="drawer-username" class="drawer-username">@username</div>

          <div class="drawer-status-row">
            <span id="drawer-presence-dot" class="chat-header-presence"></span>
            <span id="drawer-presence-label">Active</span>
          </div>

          <button type="button" id="drawer-edit-profile-btn" class="header-pill-btn" style="margin-bottom: 16px;">
            ✏️ Edit Profile
          </button>

          <div class="drawer-info-card">
            <div>
              <div class="drawer-info-label">Display name</div>
              <div id="drawer-info-fullname" class="drawer-info-value"></div>
            </div>
            <div>
              <div class="drawer-info-label">Username</div>
              <div id="drawer-info-handle" class="drawer-info-value"></div>
            </div>
            <div>
              <div class="drawer-info-label">Status</div>
              <div id="drawer-info-status" class="drawer-info-value"></div>
            </div>
            <div>
              <div class="drawer-info-label">Local time</div>
              <div id="drawer-info-localtime" class="drawer-info-value"></div>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- ========================================================================
       2. MODAL: EDIT PROFILE (PHOTO, DISPLAY NAME, @USERNAME, STATUS)
       ======================================================================== -->
  <div id="edit-profile-modal" class="modal-backdrop hidden">
    <div class="slack-modal">
      <div class="modal-header">
        <h2 id="edit-profile-modal-title" class="modal-title">Edit your profile</h2>
        <button type="button" id="btn-close-edit-profile" class="drawer-close-btn">✕</button>
      </div>
      <form id="edit-profile-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Profile photo</label>
            <div class="avatar-picker-row">
              <img id="edit-avatar-preview" class="avatar-preview-lg" src="" alt="Profile photo" />
              <div class="avatar-picker-actions">
                <div class="avatar-btn-group">
                  <label class="btn-secondary-sm" for="edit-avatar-file">
                    📷 Upload photo
                  </label>
                  <input type="file" id="edit-avatar-file" accept="image/*" class="hidden" />
                  <button type="button" id="edit-avatar-url-btn" class="btn-secondary-sm">🔗 Paste URL</button>
                </div>
                <div id="edit-preset-avatars" class="preset-avatars-strip"></div>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-display-name">Display name</label>
            <input
              type="text"
              id="edit-display-name"
              class="slack-input"
              required
              maxlength="40"
              placeholder="e.g. Alex Rivera"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-username">Username (@handle)</label>
            <div class="input-with-prefix">
              <span class="input-prefix">@</span>
              <input
                type="text"
                id="edit-username"
                class="slack-input has-prefix"
                required
                maxlength="30"
                placeholder="username"
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-status-text">Status</label>
            <input
              type="text"
              id="edit-status-text"
              class="slack-input"
              maxlength="60"
              placeholder="e.g. Working remotely"
            />
          </div>

          <div id="edit-profile-error" class="auth-error hidden"></div>
        </div>

        <div class="modal-footer">
          <button type="button" id="btn-cancel-edit-profile" class="btn-modal-cancel">Cancel</button>
          <button type="submit" id="btn-save-edit-profile" class="btn-modal-save">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
